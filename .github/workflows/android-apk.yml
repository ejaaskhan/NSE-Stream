name: Build & Release NSE Stream (APK + AAB)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  release:
    types: [ published, created, edited ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach APK & AAB to (e.g., v1.0.1)"
        required: false
        default: "v1.0.1"
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk-and-aab:
    name: Build APK & AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version tag
        id: meta
        run: |
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          DEFAULT_TAG="v${VERSION_NAME:-1.0.1}"

          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
            SHOULD_RELEASE="true"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            SHOULD_RELEASE="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.release_tag }}"
            TAG="${TAG:-$DEFAULT_TAG}"
            SHOULD_RELEASE="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TAG="${DEFAULT_TAG}"
            SHOULD_RELEASE="true"
          else
            TAG="${DEFAULT_TAG}"
            SHOULD_RELEASE="false"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${TAG} (publish to GitHub Release: ${SHOULD_RELEASE})"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Accept Android SDK Licenses & Install SDK 36.1
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          "$SDKMANAGER" --install "platforms;android-36.1" || true

      - name: Ensure Debug Keystore Exists
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -s "debug.keystore" ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -s "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK & AAB
        run: |
          gradle :app:assembleDebug :app:bundleDebug \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Djava.awt.headless=true"

      - name: Build Signed Release APK & AAB (when signing secrets are configured)
        id: release_build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > my-upload-key.jks
            KEYSTORE_PATH="$PWD/my-upload-key.jks" gradle :app:assembleRelease :app:bundleRelease \
              --no-daemon \
              --stacktrace \
              --max-workers=2 \
              -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Djava.awt.headless=true"
            echo "built_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Signing secrets not configured; publishing ready-to-install APK & AAB from debug signing."
            echo "built_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package Versioned APK, AAB & Checksums
        run: |
          mkdir -p dist
          TAG="${{ steps.meta.outputs.tag }}"

          APK_DEBUG=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          AAB_DEBUG=$(find app/build/outputs/bundle/debug -name "*.aab" | head -n 1)

          if [ -z "$APK_DEBUG" ] || [ ! -f "$APK_DEBUG" ]; then
            echo "ERROR: Debug APK not found!"
            exit 1
          fi
          if [ -z "$AAB_DEBUG" ] || [ ! -f "$AAB_DEBUG" ]; then
            echo "ERROR: Debug AAB not found!"
            exit 1
          fi

          cp "$APK_DEBUG" "dist/NSE-Stream-${TAG}.apk"
          cp "$AAB_DEBUG" "dist/NSE-Stream-${TAG}.aab"

          if [ "${{ steps.release_build.outputs.built_release }}" = "true" ]; then
            APK_RELEASE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            AAB_RELEASE=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
            if [ -n "$APK_RELEASE" ] && [ -f "$APK_RELEASE" ]; then
              cp "$APK_RELEASE" "dist/NSE-Stream-${TAG}-release.apk"
            fi
            if [ -n "$AAB_RELEASE" ] && [ -f "$AAB_RELEASE" ]; then
              cp "$AAB_RELEASE" "dist/NSE-Stream-${TAG}-release.aab"
            fi
          fi

          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt)
          ls -lh dist/

      - name: Upload APK & AAB Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NSE-Stream-${{ steps.meta.outputs.tag }}-apk-aab
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK & AAB to GitHub Release
        if: steps.meta.outputs.should_release == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          RELEASE_NOTES=$(cat <<EOF
          ## NSE STREAM ${TAG}

          ### Downloads
          - **Android Installer (APK):** \`NSE-Stream-${TAG}.apk\`
          - **Android App Bundle (AAB):** \`NSE-Stream-${TAG}.aab\`
          - **Checksums:** \`SHA256SUMS.txt\`

          ### What's New in v1.0.1
          - Removed the subtitle below the **NSE STREAM** logo while preserving the dark-and-crimson UI, movie cards, categories, and search layout.
          - Rebuilt server integration around a centralized, configurable API client with an in-app **Server Settings** dialog and legitimate public-domain HLS/MP4 film catalog.
          - Fixed Media3 ExoPlayer initialization, added HLS (\`.m3u8\`) and MP4 support, stall timeout protection, and a **Stream Unavailable** recovery overlay with **Retry** and **Switch Quality** controls.
          - Added debounced live search, graceful network error cards with **Retry**, and bumped app version to **1.0.1** (\`versionCode = 2\`).
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — uploading APK & AAB assets..."
            gh release upload "$TAG" dist/* --clobber
          else
            echo "Creating GitHub Release ${TAG} with APK & AAB assets..."
            gh release create "$TAG" dist/* \
              --target "${GITHUB_SHA}" \
              --title "NSE STREAM ${TAG}" \
              --notes "$RELEASE_NOTES"
          fi
