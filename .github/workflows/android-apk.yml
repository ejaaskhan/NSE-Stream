name: Build & Release NSE Stream APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build & publish (e.g., v1.0.1)"
        required: false
        default: "v1.0.1"
        type: string
      create_release:
        description: "Create or update GitHub Release with APK attached"
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build NSE Stream APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            SHOULD_RELEASE="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.release_tag }}"
            SHOULD_RELEASE="${{ inputs.create_release }}"
          else
            VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
            TAG="v${VERSION_NAME:-1.0.1}"
            SHOULD_RELEASE="false"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Resolved build tag: ${TAG} (publish release: ${SHOULD_RELEASE})"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Accept Android SDK Licenses & Install SDK 36.1
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          "$SDKMANAGER" --install "platforms;android-36.1" || true

      - name: Ensure Debug Keystore Exists
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -s "debug.keystore" ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -s "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Djava.awt.headless=true"

      - name: Build Signed Release APK (when signing secrets are configured)
        id: release_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > my-upload-key.jks
            KEYSTORE_PATH="$PWD/my-upload-key.jks" gradle :app:assembleRelease \
              --no-daemon \
              --stacktrace \
              --max-workers=2 \
              -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Djava.awt.headless=true"
            echo "built_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Signing secrets not configured; skipping signed release APK (debug APK built cleanly)."
            echo "built_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package Versioned APK & Checksums
        run: |
          mkdir -p dist
          TAG="${{ steps.meta.outputs.tag }}"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/NSE-Stream-${TAG}-debug.apk"
          if [ "${{ steps.release_apk.outputs.built_release }}" = "true" ] && [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/NSE-Stream-${TAG}-release.apk"
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist/

      - name: Upload NSE Stream APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSE-Stream-${{ steps.meta.outputs.tag }}-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.meta.outputs.should_release == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          RELEASE_NOTES=$(cat <<'EOF'
          ## NSE STREAM v1.0.1

          ### What's New
          - Removed the subtitle below the **NSE STREAM** logo while preserving the dark-and-crimson UI, movie cards, categories, and search layout.
          - Rebuilt server integration around a centralized, configurable API client (`ApiConfig`) with an in-app **Server Settings** dialog and legitimate public-domain HLS/MP4 film catalog.
          - Fixed Media3 ExoPlayer initialization, added HLS (`.m3u8`) and MP4 support, stall timeout protection, and a **Stream Unavailable** recovery overlay with **Retry** and **Switch Quality** controls.
          - Added debounced live search, graceful network error cards with **Retry**, and bumped app version to **1.0.1** (`versionCode = 2`).

          ### Installation
          Download `NSE-Stream-v1.0.1-debug.apk` (or `-release.apk` when signing secrets are configured) below and install on Android 7.0+ (API 24+).
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "${GITHUB_SHA}" \
              --title "NSE STREAM ${TAG}" \
              --notes "$RELEASE_NOTES"
          fi
